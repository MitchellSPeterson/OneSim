[package]
name = "onesim-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-process OneSim runtime for WebAssembly: the onesim-runtime C ABI backed by onesim-render"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Link against a Swift app: `simcore_web_init` runs its `main` (scripts/build-web.sh). Off for React Native (scripts/build-web.sh --expo).
swift = []

[dependencies]
onesim-protocol = { path = "../onesim-protocol" }
onesim-render = { path = "../onesim-render" }
serde_json.workspace = true
