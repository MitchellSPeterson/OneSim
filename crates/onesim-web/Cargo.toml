[package]
name = "onesim-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-process OneSim runtime for WebAssembly: the onesim-runtime C ABI backed by onesim-render"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# Standalone browser module for JS-hosted guests (e.g. Kotlin/Wasm Compose): no linked Swift main;
# guest callbacks are Wasm imports from `"onesim_guest"`.
js-guest = []

[dependencies]
onesim-protocol = { path = "../onesim-protocol" }
onesim-render = { path = "../onesim-render" }
serde_json.workspace = true
