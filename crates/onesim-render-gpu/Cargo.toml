[package]
name = "onesim-render-gpu"
description = "wgpu + Vello display-list executor and headless renderer backend for OneSim scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
# Headless `GpuRenderer` (Builder + Executor + readback), adapter probing and the CPU backdrop fallback; they
# block on the GPU, so they are not available on wasm32-unknown-unknown (use `Executor` there).
native = ["dep:pollster", "dep:onesim-render", "dep:tiny-skia"]

[dependencies]
onesim-display = { path = "../onesim-display" }
onesim-render = { path = "../onesim-render", optional = true }
tiny-skia = { version = "0.11", optional = true }
vello = "=0.12.0"
pollster = { version = "0.4", optional = true }
log = "0.4"

[dev-dependencies]
pollster = "0.4"
serde_json.workspace = true
onesim-protocol = { path = "../onesim-protocol" }
