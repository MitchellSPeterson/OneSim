[package]
name = "onesim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `onesim` command line: JSON-lines API server and headless driver"

[[bin]]
name = "onesim"
path = "src/main.rs"

[dependencies]
onesim-protocol = { path = "../onesim-protocol" }
onesim-render = { path = "../onesim-render" }
onesim-host = { path = "../onesim-host" }
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
