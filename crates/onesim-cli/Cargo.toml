[package]
name = "onesim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `onesim` command line: JSON-lines API server and headless driver"

[[bin]]
name = "onesim"
path = "src/main.rs"

[dependencies]
onesim-protocol = { path = "../onesim-protocol" }
onesim-render = { path = "../onesim-render" }
onesim-host = { path = "../onesim-host" }
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3.6", default-features = false, optional = true }
onesim-render-gpu = { path = "../onesim-render-gpu", optional = true }

[features]
gpu = ["onesim-host/gpu"]
# `onesim window` / `onesim expo --window`: a native window (winit + softbuffer), GPU first via wgpu.
window = ["gpu", "dep:winit", "dep:softbuffer", "dep:arboard", "dep:onesim-render-gpu"]
