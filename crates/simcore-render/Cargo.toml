[package]
name = "simcore-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SimCore framework-neutral scene, SwiftUI-semantics layout, rasterizer and hit testing"

[features]
# Native window for the `counter` example (winit + softbuffer).
window = ["dep:winit", "dep:softbuffer"]

[dependencies]
simcore-protocol = { path = "../simcore-protocol" }
tiny-skia = "0.11"
cosmic-text = "0.19"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[dev-dependencies]
serde_json.workspace = true
