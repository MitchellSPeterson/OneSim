[package]
name = "simcore-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SimCore framework-neutral scene, SwiftUI-semantics layout, rasterizer and hit testing"

[features]
# Native window for the `counter` example (winit + softbuffer).
window = ["dep:winit", "dep:softbuffer"]

[dependencies]
simcore-protocol = { path = "../simcore-protocol" }
tiny-skia = "0.11"
cosmic-text = "0.19"
resvg = { version = "0.45", default-features = false }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
