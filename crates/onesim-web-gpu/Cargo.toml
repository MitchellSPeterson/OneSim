[package]
name = "onesim-web-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebGPU display-list presenter for the browser: onesim-render-gpu's Executor on wasm32-unknown-unknown behind wasm-bindgen (docs/web.md)"

[lib]
# cdylib is what wasm-bindgen consumes; rlib keeps `cargo build --workspace` / clippy happy on native.
crate-type = ["cdylib", "rlib"]

# Everything below is wasm32-only (see src/lib.rs): on native targets this crate is empty, so the workspace
# builds, lints and tests unchanged. Build it with `--target wasm32-unknown-unknown` (scripts/build-web.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
onesim-render = { path = "../onesim-render" }
onesim-render-gpu = { path = "../onesim-render-gpu", default-features = false }
# `webgpu` is a default wgpu feature; stated here so it can never be lost (the browser backend is the only one on wasm).
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl", "std", "parking_lot"] }
# Pinned to the installed `wasm-bindgen` CLI: the CLI and the crate must be the same version.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"
serde_json.workspace = true
log = "0.4"
console_error_panic_hook = "0.1"
