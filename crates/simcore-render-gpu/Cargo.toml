[package]
name = "simcore-render-gpu"
description = "wgpu + Vello display-list executor and headless renderer backend for SimCore scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
# Headless `GpuRenderer` (Builder + Executor + readback), adapter probing and the CPU backdrop fallback; they
# block on the GPU, so they are not available on wasm32-unknown-unknown (use `Executor` there).
native = ["dep:pollster"]

[dependencies]
simcore-render = { path = "../simcore-render" }
tiny-skia = "0.11"
vello = "=0.12.0"
pollster = { version = "0.4", optional = true }
log = "0.4"

[dev-dependencies]
pollster = "0.4"
serde_json.workspace = true
simcore-protocol = { path = "../simcore-protocol" }
