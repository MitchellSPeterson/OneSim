[package]
name = "simcore-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `simcore` command line: JSON-lines API server and headless driver"

[[bin]]
name = "simcore"
path = "src/main.rs"

[dependencies]
simcore-protocol = { path = "../simcore-protocol" }
simcore-render = { path = "../simcore-render" }
simcore-host = { path = "../simcore-host" }
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
simcore-render-gpu = { path = "../simcore-render-gpu", optional = true }

[features]
gpu = ["simcore-host/gpu"]
# `simcore window` / `simcore expo --window`: a native window (winit + softbuffer), GPU first via wgpu.
window = ["gpu", "dep:winit", "dep:softbuffer", "dep:simcore-render-gpu"]
