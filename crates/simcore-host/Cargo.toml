[package]
name = "simcore-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SimCore session manager and external API (docs/protocol.md section A)"

[dependencies]
simcore-protocol = { path = "../simcore-protocol" }
simcore-render = { path = "../simcore-render" }
simcore-render-gpu = { path = "../simcore-render-gpu", optional = true }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
log = "0.4"
tungstenite = "0.30.0"
libc = "0.2.191"

[features]
# GPU renderer (wgpu + Vello); off by default so CPU-only builds need no GPU stack.
gpu = ["dep:simcore-render-gpu"]
