[package]
name = "onesim-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OneSim framework-neutral scene, SwiftUI-semantics layout, rasterizer and hit testing"

[features]
default = ["font-inter", "font-roboto"]
font-inter = []
font-roboto = []
# Native window for the `counter` example (winit + softbuffer).
window = ["dep:winit", "dep:softbuffer"]

[dependencies]
serde_json.workspace = true
onesim-display = { path = "../onesim-display" }
onesim-protocol = { path = "../onesim-protocol" }
tiny-skia = "0.11"
cosmic-text = "0.19"
taffy = "0.15"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
zune-jpeg = "0.5.15"
unicode-segmentation = "1"

[dev-dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
