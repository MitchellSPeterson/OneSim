name: API request (Expo / React Native / SwiftUI / Compose)
description: An Expo, React Native, SwiftUI or Jetpack Compose API is missing, partial, or unsupported in OneSim.
title: "[API] <package>: <API>"
labels: ["api"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/compatibility](https://github.com/MitchellSPeterson/OneSim/blob/main/docs/compatibility/README.md) first. Once this issue exists, link it in that row's **Issue** column.
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: expo-file-system, SwiftUI, androidx.compose.material3
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: API (module, component or method)
      placeholder: File.text(), Paths.document
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [iOS, Android]
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Current status in the coverage doc
      options: ["⬜ planned (not started)", "⛔ unsupported (diagnostic)", "🟠 partial", "Not listed"]
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: What the app does with it
      description: A minimal snippet, the OneSim diagnostic you saw (`OneSim: X is not supported ...`), and what a preview should show.
  - type: textarea
    id: approach
    attributes:
      label: Implement or simulate?
      description: Should OneSim run it for real (e.g. a file system in a sandbox dir) or simulate it with host-controlled state (`modules.simulate`)? Optional.
