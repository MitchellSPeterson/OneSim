name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo build -p simcore-render --examples --features window
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: SwiftUI wire test (build, 1100 actions, memory, isolation of stdout)
        run: frameworks/swiftui/Tests/wire_test.sh
      - name: End-to-end headless counter
        run: |
          cargo run -q -p simcore-cli -- run examples/swiftui-counter --root-view CounterView \
            --click Increment --inspect | grep -q '"Count: 1"'
      - name: Render showcase fixtures (light + dark PNGs)
        run: cargo run -q -p simcore-render --example showcase -- --out target/showcase-render
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-render
          path: target/showcase-render
      - name: Navigation, text input and scroll through the fake guest
        run: |
          ln -sf "$PWD/target/debug/simcore-fake-guest" target/debug/fake-nav-guest
          cargo run -q -p simcore-cli -- run target/debug/fake-nav-guest \
            --click Todos --click "New todo" --type "Buy milk" --key backspace --click Add --inspect \
            --screenshot target/showcase-render/ci-todos.png | grep -q '"Buy mil"'
