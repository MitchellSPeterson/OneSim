# Level A on every PR commit and push to main (fast: the checks the change affects, compile + targeted tests +
# smoke states), level C nightly, on `v*` tags and on manual runs (full: every check, Linux/Windows included).
# Level B (premerge) is premerge.yml. Required check: `ci-fast` (and `ci-premerge`, the status premerge.yml sets).
# See docs/ci.md.
name: CI
on:
  pull_request:
  push:
    branches: [main] # other branches are covered by their PR run
    tags: ['v*']
  schedule:
    - cron: '0 8 * * *' # nightly full regression
  workflow_dispatch:
    inputs:
      level:
        description: Level to run (full runs every check; fast and premerge diff against main)
        type: choice
        options: [full, premerge, fast]
        default: full

# A new commit cancels the PR's previous run. Everything else (main, tags, nightly, manual) gets its own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      level: ${{ inputs.level || '' }}

  # The required check. Runs even when the checks failed or were cancelled, so it can only pass on success.
  ci-fast:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "$RESULT" = success ] || { echo "::error::checks: $RESULT"; exit 1; }'
        env:
          RESULT: ${{ needs.checks.result }}

  # Deprecated alias of ci-fast for the current ruleset (which requires `ci`). Delete once the ruleset requires
  # `ci-fast` and `ci-premerge` instead (docs/ci.md, "GitHub settings").
  ci:
    needs: ci-fast
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "$RESULT" = success ] || { echo "::error::ci-fast: $RESULT"; exit 1; }'
        env:
          RESULT: ${{ needs.ci-fast.result }}
