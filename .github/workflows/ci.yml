name: CI
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pick the gates from the changed paths (scripts/affected.sh holds the mapping). Pushes to main run all of them.
  # Skipped jobs count as passed, so branch protection should require the `ci` job at the end, not the others.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
      swiftui: ${{ steps.affected.outputs.swiftui }}
      compose: ${{ steps.affected.outputs.compose }}
      expo: ${{ steps.affected.outputs.expo }}
      web: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            scripts/affected.sh --all --github-output
          else
            scripts/affected.sh --base "$BASE" --github-output
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compatibility docs (coverage summaries, guest module registry, pinned versions)
        run: node scripts/api-coverage.mjs --check

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo build -p onesim-render --examples --features window
      - run: cargo test --workspace
        env:
          SIMCORE_SKIP_GPU_TESTS: '1'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p onesim-cli --features window --all-targets -- -D warnings
      - name: Render showcase fixtures (light + dark PNGs)
        run: cargo run -q -p onesim-render --example showcase -- --out target/showcase-render
      - name: Navigation, text input and scroll through the fake guest
        run: |
          ln -sf "$PWD/target/debug/onesim-fake-guest" target/debug/fake-nav-guest
          cargo run -q -p onesim-cli -- run target/debug/fake-nav-guest \
            --click Todos --click "New todo" --type "Buy milk" --key backspace --click Add --inspect \
            --screenshot target/showcase-render/ci-todos.png | grep -q '"Buy mil"'
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-render
          path: target/showcase-render

  swiftui:
    needs: changes
    if: needs.changes.outputs.swiftui == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: SwiftUI wire test (build, 1100 actions, memory, isolation of stdout)
        run: frameworks/swiftui/Tests/wire_test.sh
      - name: End-to-end headless counter
        run: |
          cargo run -q -p onesim-cli -- run examples/swiftui-counter --root-view CounterView \
            --click Increment --inspect | grep -q '"Count: 1"'
      - name: Install Pillow for screenshot comparisons
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
      - name: iOS pixel-diff gate, SwiftUI states (every state < 2%)
        run: scripts/compare-ios.sh
        env:
          SIMCORE_ONLY: swiftui
      - name: iOS pixel-diff gate, SwiftUI states, fallback fonts/symbols (every state < 3.5%)
        run: scripts/compare-ios.sh
        env:
          SIMCORE_ONLY: swiftui
          SIMCORE_FALLBACK: '1'
      - name: Upload iOS comparison sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-comparison-swiftui
          path: target/compare/

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: End-to-end Jetpack Compose counter (Kotlin guest, real Compose runtime)
        run: |
          cargo run -q -p onesim-cli -- run examples/compose-counter \
            --click Increment --click Increment --click Decrement --inspect | grep -q '"Count: 1"'
      - name: Install Pillow for screenshot comparisons
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
      - name: Android pixel-diff gate, Compose vs the Android 17 emulator (every state < 2%)
        run: scripts/compare-android.sh
      - name: Upload Android comparison sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-comparison-compose
          path: target/compare/

  expo:
    needs: changes
    if: needs.changes.outputs.expo == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Expo fixture dependencies
        run: |
          npm ci --prefix examples/expo-showcase
          npm ci --prefix examples/expo-router-stack
          npm ci --prefix examples/expo-default
          npm ci --prefix examples/expo-ui
      - name: Install Pillow for screenshot comparisons
        run: python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
      - name: iOS pixel-diff gate, Expo states (every state < 2%)
        run: scripts/compare-ios.sh
        env:
          SIMCORE_ONLY: expo
      - name: iOS pixel-diff gate, Expo states, fallback fonts/symbols (every state < 3.5%)
        run: scripts/compare-ios.sh
        env:
          SIMCORE_ONLY: expo
          SIMCORE_FALLBACK: '1'
      - name: Android pixel-diff gate, Expo vs the Android 17 emulator
        run: scripts/compare-expo-android.sh
      - name: Upload iOS and Android comparison sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-expo
          path: target/compare/

  web:
    # Build the two Wasm modules, verify CPU pixel parity, and exercise the browser presenter.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: macos-latest
    env:
      SWIFT_VERSION: 6.4.2
      SWIFT_WASM_SHA256: 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo clippy -p onesim-web-gpu --target wasm32-unknown-unknown -- -D warnings
      - name: Cache Swift toolchain and Wasm SDK downloads
        uses: actions/cache@v4
        with:
          path: ~/swift-downloads
          key: swift-${{ env.SWIFT_VERSION }}-wasm-downloads
      - name: Install swift.org toolchain and Wasm SDK
        run: |
          set -euo pipefail
          mkdir -p ~/swift-downloads && cd ~/swift-downloads
          pkg="swift-$SWIFT_VERSION-RELEASE-osx.pkg"
          sdk="swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz"
          [ -f "$pkg" ] || curl -fsSL --retry 3 -o "$pkg" "https://download.swift.org/swift-$SWIFT_VERSION-release/xcode/swift-$SWIFT_VERSION-RELEASE/$pkg"
          [ -f "$sdk" ] || curl -fsSL --retry 3 -o "$sdk" "https://download.swift.org/swift-$SWIFT_VERSION-release/wasm-sdk/swift-$SWIFT_VERSION-RELEASE/$sdk"
          installer -pkg "$pkg" -target CurrentUserHomeDirectory
          export PATH="$HOME/Library/Developer/Toolchains/swift-$SWIFT_VERSION-RELEASE.xctoolchain/usr/bin:$PATH"
          swift --version
          swift sdk install "$PWD/$sdk" --checksum "$SWIFT_WASM_SHA256"
          swift sdk list
      - name: Optional wasm-opt (binaryen); the build skips optimisation if absent
        run: brew install binaryen || echo "::warning::binaryen unavailable; app.wasm will not be optimised"
      - name: Build web, counter (root view) + Node harness
        run: |
          scripts/build-web.sh examples/swiftui-counter CounterView
          node web/test/run.mjs --suite counter
      - name: Build web, showcase (@main App, no root view) + Node harness
        run: |
          scripts/build-web.sh examples/swiftui-showcase
          node web/test/run.mjs --suite showcase
      - name: Browser presenter (CPU fallback and WebGPU when an adapter is available)
        run: |
          export CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          [ -x "$CHROME" ] || brew install --cask google-chrome
          test -x "$CHROME"
          node web/test/presenter.mjs --app
      - name: Web vs native pixel parity (every state < 2%)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          scripts/compare-web.sh
      - name: Upload web comparison sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-comparison
          path: target/compare-web/

  # The one check to require in branch protection: fails if any gate failed, passes if the rest passed or were skipped.
  ci:
    needs: [changes, rust, swiftui, compose, expo, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
