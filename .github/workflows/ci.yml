# Full regression: every check, Linux/Windows included, nightly, on `v*` tags and on manual runs (which can also pick
# the fast or premerge level). Pull requests run no CI until they are ready to merge: premerge.yml runs the affected
# checks once a PR has the `ready-to-merge` label and sets the required statuses. See docs/ci.md.
name: CI
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 8 * * *' # nightly full regression
  workflow_dispatch:
    inputs:
      level:
        description: Level to run (full runs every check; fast and premerge diff against main)
        type: choice
        options: [full, premerge, fast]
        default: full

# Tags, nightly and manual runs never cancel each other.
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      level: ${{ inputs.level || '' }}
