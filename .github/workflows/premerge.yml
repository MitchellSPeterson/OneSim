# The only CI a pull request gets: the full suites of every affected check (iOS 27.2 and Android pixel diffs, web
# parity), once the PR is ready to merge. Commits on a PR without the label run nothing but the cheap gate job.
# This workflow runs the PR's code with a read-only token, so it posts no statuses itself: premerge-status.yml (which
# runs from main, never checks out PR code, and works for fork PRs) sets `ci-premerge` and `ci` on the head commit:
#   - no `ready-to-merge` label: pending ("add the ready-to-merge label")
#   - labelled: pending while this runs, then success or failure from the `report` job
#   - each new commit on a labelled PR runs it again; the new head has no status until it passes
# With "require branches to be up to date" in the ruleset, the head commit is the exact merge candidate, so a pass
# on an older commit can never satisfy the check. Merge queue (`merge_group`) works too where GitHub offers it.
# See docs/ci.md.
name: Pre-merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  merge_group:

# One run per PR; a new commit or relabel cancels the old one. Other labels get their own group so they never cancel.
concurrency:
  group: premerge-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ready-to-merge') && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          READY: ${{ github.event_name == 'merge_group' || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}
          RELEVANT: ${{ github.event.action != 'labeled' || github.event.label.name == 'ready-to-merge' }}
        run: |
          # Another label, or no `ready-to-merge` label: run nothing (premerge-status.yml sets the pending status).
          if [ "$RELEVANT" = true ] && [ "$READY" = true ]; then run=true; else run=false; fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      level: premerge

  # premerge-status.yml reads this job's conclusion and turns it into the `ci-premerge` status.
  report:
    needs: [gate, checks]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "pre-merge checks: $RESULT"
          [ "$RESULT" = success ]
