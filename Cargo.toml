[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MitchellSPeterson/OneSim"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.wasm.package.tiny-skia]
opt-level = 3

[profile.wasm.package.onesim-render]
opt-level = 3

[profile.wasm-fast]
inherits = "release"
opt-level = 1
lto = "off"
panic = "abort"

[profile.wasm-gpu]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
